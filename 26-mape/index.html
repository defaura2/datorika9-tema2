<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuiļa simulātors</title>
<style>
/* Pamata izkārtojums — šīs rindas nemaini */
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px 16px; margin: 6px 0; cursor: pointer; }
img, audio { max-width: 100%; }
[hidden] { display: none !important; }

/* NOFORMĒ ŠEIT: pielieto 2.1. un 2.2. nodarbībā apgūto CSS */
body {
  background-color: #1ac080;
  color: #b4742a;
}

h1 {
  color: #bd9f1b;
  text-align: center;
  font-size: 30px;
}

.noteikumi {
  background-color: #b44040;
  color: #43af11;
  padding: 16px;
  border-radius: 15px;
}

.laukums {
  width: 360px;
  padding: 20px;
  border: 4px dashed #5ca0b1;
  background-color: #03519e;
  box-sizing: border-box;
  border-radius: 15px;
  margin: 20px auto;
  max-width: 100%;
  text-align: center;
  box-sizing: border-box;
}

button {
  background-color: #912436;
  color: #d008eb;
  border: 0;
  border-radius: 10px;
}
button:hover { outline: 20px solid #c50606; }
</style>
</head>
<body>
<h1>Kuiļa simulātors</h1>
<p>Īss spēles mērķa apraksts spēlētājam.</p>
<section class="noteikumi">
  <h2>Noteikumi</h2>
  <p>Uzspiežot pogu, Kuilis savāc sapuvušo ēdienu</p>
  <p>Skaņas efekts tiek atskaņots, kad spēlētājs savāc punktus.</p>
</section>
<div class="laukums">
  <h2>Spēles laukums</h2>
  <img src="atteli/varonis.png" alt="Kuilis" width="128">
  <p>Skaņa Savācot ēdinu:</p>
  <audio controls src="skanas/oink.mp3"></audio>
  <p id="punkti">Ēdiens: 0</p>
  <button onclick="savakt()">Savākt ēdienu</button>
</div>
<script>
// Gatava punktu poga — šo skriptu nemaini.
let punkti = 0;
function savakt() {
  punkti = punkti + 1;
  document.getElementById("punkti").textContent = "Ēdiens: " + punkti;
}
</script>
</body>
</html>
