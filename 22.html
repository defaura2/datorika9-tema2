<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuiļa Simulātors</title>
<style>
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; }
button { cursor: pointer; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
.laukums {
  width: 365px;
  height: 250px;
  padding: 25px;
  margin: 20px auto;
  border: 9px solid #106918;
  background-color: #963a3a75;
  box-sizing: border-box;
  max-width: 100%;
}
.pogas { display: flex; gap: 12px; flex-wrap: wrap; } 
</style>
</head>
<body>
<h1>Kuiļa Sēta</h1>
<div class="laukums">
  <p>Šeit būs sapuvušais ēdiens</p>
</div>
<div class="pogas">
<button>Sākt</button>
<button>Noteikumi</button>
</div>

</body>
</html>
