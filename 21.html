<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuiļa Simulātors</title>
<style>
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; }
button { cursor: pointer; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
body { background-color: #ffffff; color: #222222; }
h1 { color: #4b8534; }
.noteikumi { background-color: #28b3c5; padding: 12px; border-radius: 12px; }
button { background-color: #680f8b; color: #ffffff; border: 0; }
</style>
</head>
<body>
<h1>Kuiļa Simulātors</h1>
<section class="noteikumi">
  <h2>Noteikumi</h2>
  <ul>
    <li>Izmanto bulttaustiņus, lai pārvietotos.</li>
    <li>Izvairies no šķēršļiem.</li>
    <li>Savāc visus sapuvušos ēdienus, lai uzvarētu.</li>
</section>
<button>Sākt spēli</button>
</body>
</html>
